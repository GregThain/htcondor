name: Build and Test HTCondor

on:
  push:
    branches: [ "main", "gha-actions-test" ]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        instance: [ 
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_v2_AlmaLinux10-24090101"},
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_AlmaLinux8-24090100"},
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_AlmaLinux9-24090100"},
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_AlmaLinux10-24090100"},
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_AmazonLinux2023-24090100"},
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_Debian11-24090100"},
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_Debian12-24090100"},
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_openSUSE15-24090100"},
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_Ubuntu22-24090100"},
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_Ubuntu24-24090100"},
        {"img": "ubuntu-latest", "container": "htcondor/nmi-build:x86_64_Fedora41-24090100"},
        {"img": "ubuntu-24.04-arm", "container": "htcondor/nmi-build:aarch64_AlmaLinux8-24090100"},
        {"img": "ubuntu-24.04-arm", "container": "htcondor/nmi-build:aarch64_AlmaLinux9-24090100"},
        {"img": "ubuntu-24.04-arm", "container": "htcondor/nmi-build:aarch64_AlmaLinux10-24090100"},
      ]
    # Host OS and CPU
    runs-on: ${{ matrix.instance.img }}

    # Use htcondor build containers for the real work
    container:
      image: ${{ matrix.instance.container }}
      env:
        OMP_NUM_THREADS: 4
      volumes:
        - my_docker_volume:/volume_mount
      options: --cpus 4
    steps:
      - name: Make Platform Name
        id: platform_name
        run: echo "platform_name=$(echo ${{ matrix.instance.container }} | sed -e 's/htcondor\/nmi-build://g' -e 's/-[0-9]*$//g')" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      #- name: Native Package Build
      #  run: (./build-on-linux.sh .)

      - name: Build
        run: |
          # Hackery for using toolset gcc instead of default
          if [ -f "/opt/rh/gcc-toolset-14/root/usr/bin/gcc" ]; then
            export CC=/opt/rh/gcc-toolset-14/root/usr/bin/gcc
            export CXX=/opt/rh/gcc-toolset-14/root/usr/bin/g++
          fi

          if [ -f "/usr/bin/gcc-11" ] 
          then
            export CC=/usr/bin/gcc-11
            export CXX=/usr/bin/g++-11
          fi

          chmod 0777 .
          mkdir __build && chown condorauto __build && chmod 0777 __build
          su condorauto -c "cd __build && cmake -GNinja -DWITH_LIBVIRT:bool=false -DWITH_VOMS:bool=false .. && ninja -j 4 install"

      - name: test
        run: ( su condorauto -c "cd __build && ctest --output-junit test.xml -j 40")

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-for-${{ steps.platform_name.outputs.platform_name }}
          path: __build/test.xml
          retention-days: 1
          overwrite: true

  macbuild:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/opt/homebrew/bin/brew shellenv)"

      #- name: Install dependencies
      #  run: brew install perl

      - name: Install python
        uses: actions/setup-python@v5

      - name: Install python accessories
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-httpserver

      - name: Build
        run: (mkdir __build && cd __build && cmake -GNinja -DWITH_VOMS:bool=false .. && ninja -j4 install)

      # Still too slow to debu
      #- name: Test
      #  run: (cd __build && ctest -j 20 )

  winbuild:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install VC++ Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          distribution: strawberry

      - name: cmake configuration
        run: (cmake -G "Visual Studio 17 2022" -DWITH_KRB5:bool=false .)

      - name: build
        run: (cmake --build . --verbose --config Release --parallel 4)

  dashboard:
    needs: [build, macbuild, winbuild]
    runs-on: ubuntu-latest
    if: always()
    steps:
         - name: Download all artifacts
           uses: actions/download-artifact@v4

         - name: create_summary
           shell: python
           run: |
             import os
             import sys
             import xml.etree.ElementTree as ET
             from pathlib import Path
             from collections import defaultdict

             results = defaultdict(dict)

             for dir in Path(".").iterdir():
               test_xml = dir / 'test.xml'
               for elem in ET.parse(test_xml).getroot().findall("testcase"):
                 testname = elem.get("name")
                 teststatus = elem.get("status")
                 results[dir][testname] = teststatus

             header = "| test |"
             separator = "|---|"

             for platform in results.keys():
               header += f"{platform}|"
               separator += "---|"

             with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
               f.write(header + "\n")
               f.write(separator + "\n")

             alltests = set()
             for platform in results.values():
               for name in platform:
                 alltests.add(name)

             for test in alltests:
               line = f"| {test} |"
               for platform in results.keys():
                 if test in results[platform]:
                   line += f"{results[platform][test]} |"
                 else:
                   line += " - |"
               with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                 f.write(line + "\n")
